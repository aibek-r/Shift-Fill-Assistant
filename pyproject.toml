[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shift-fill-assistant"
version = "0.1.0"
description = "AI workflow assistant that vets clinicians for open healthcare shifts and drafts outreach."
readme = "README.md"
requires-python = ">=3.11"
# Floors are the versions this project was tested with (Python 3.13); the UI relies on
# Streamlit 1.64 APIs such as horizontal containers and keyed expanders.
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "numpy>=2.0,<3",
    "fastembed>=0.8,<1",
    "streamlit>=1.64,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17", "mypy>=2.4,<3"]

[project.scripts]
shift-assistant = "shift_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
